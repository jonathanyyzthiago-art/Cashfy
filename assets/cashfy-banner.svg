<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-label="Cashfy — Tenha o controle total das suas vendas">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08060f"/><stop offset=".52" stop-color="#170d2b"/><stop offset="1" stop-color="#090611"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5ccff"/><stop offset=".48" stop-color="#ad65ff"/><stop offset="1" stop-color="#7020df"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8d38ff" stop-opacity="0"/><stop offset=".5" stop-color="#c28aff"/><stop offset="1" stop-color="#8d38ff" stop-opacity="0"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#8e39ff" stop-opacity=".42"/><stop offset="1" stop-color="#8e39ff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
 </defs>
 <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
 <rect x="2" y="2" width="1596" height="416" rx="27" fill="none" stroke="#8c35ff" stroke-width="2" opacity=".85"/>
 <ellipse cx="360" cy="205" rx="300" ry="210" fill="url(#glow)" filter="url(#blur)"/>
 <ellipse cx="1240" cy="190" rx="380" ry="210" fill="url(#glow)" filter="url(#blur)" opacity=".7"/>
 <path d="M0 340L230 110H430M1180 420L1510 90H1600" fill="none" stroke="#6820c9" stroke-width="2" opacity=".22"/>
 <path d="M0 365L235 130M1320 420L1600 140" stroke="url(#shine)" stroke-width="3" opacity=".8"/>
 <!-- Emblema C personalizado -->
 <g transform="translate(255 202)">
  <path d="M105 -112A145 145 0 1 0 105 112" fill="none" stroke="#6820c9" stroke-width="70" stroke-linecap="round" opacity=".5" filter="url(#shadow)"/>
  <path d="M105 -112A145 145 0 1 0 105 112" fill="none" stroke="url(#purple)" stroke-width="62" stroke-linecap="round"/>
  <path d="M42 0H155" stroke="#bd87ff" stroke-width="55" stroke-linecap="round"/>
  <path d="M-115 -75C-25 -180 150 -155 225 -20S250 80 175 125" fill="none" stroke="#a44dff" stroke-width="2" opacity=".72"/>
  <path d="M-125 -35C-40 -130 125 -125 210 10" fill="none" stroke="#d0a6ff" stroke-width="1.5" opacity=".42"/>
 </g>
 <!-- Marca e headline -->
 <g font-family="Arial,Helvetica,sans-serif">
  <text x="560" y="82" font-size="38" font-weight="800" letter-spacing="-1" fill="#f7f3ff">Cashf<tspan fill="#a64cff">y</tspan></text>
  <text x="560" y="170" font-size="61" font-weight="800" letter-spacing="-2" fill="#fff">Tenha o controle total</text>
  <text x="560" y="238" font-size="61" font-weight="800" letter-spacing="-2" fill="#fff">das suas <tspan fill="#ae65ff">vendas.</tspan></text>
 </g>
 <!-- Mini notificação no topo direito -->
 <g font-family="Arial,Helvetica,sans-serif">
  <rect x="1230" y="32" width="310" height="68" rx="13" fill="#120d1e" stroke="#7040a9" stroke-opacity=".7"/>
  <circle cx="1262" cy="66" r="15" fill="#6326a5"/><path d="M1255 66l5 5 10-12" fill="none" stroke="#eadbff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1290" y="60" font-size="16" font-weight="700" fill="#fff">Venda registrada</text>
  <text x="1290" y="80" font-size="12" fill="#bda8d7">Tudo organizado em um só lugar</text>
 </g>
 <!-- Três benefícios em destaque -->
 <g font-family="Arial,Helvetica,sans-serif">
  <g transform="translate(560 300)">
   <rect width="285" height="78" rx="13" fill="#171024" stroke="#7040a9" stroke-opacity=".7"/>
   <circle cx="35" cy="39" r="17" fill="#52218b"/><path d="M26 39h18M35 30v18" stroke="#e4ceff" stroke-width="2.5" stroke-linecap="round"/>
   <text x="64" y="34" font-size="16" font-weight="700" fill="#fff">Vendas organizadas</text>
   <text x="64" y="55" font-size="12" fill="#c4b4d8">Acompanhe cada registro</text>
  </g>
  <g transform="translate(865 300)">
   <rect width="285" height="78" rx="13" fill="#171024" stroke="#7040a9" stroke-opacity=".7"/>
   <circle cx="35" cy="39" r="17" fill="#52218b"/><path d="M27 32h16v14H27zM31 28h8" fill="none" stroke="#e4ceff" stroke-width="2" stroke-linejoin="round"/>
   <text x="64" y="34" font-size="16" font-weight="700" fill="#fff">Produtos sob controle</text>
   <text x="64" y="55" font-size="12" fill="#c4b4d8">Gerencie seu catálogo</text>
  </g>
  <g transform="translate(1170 300)">
   <rect width="350" height="78" rx="13" fill="#171024" stroke="#7040a9" stroke-opacity=".7"/>
   <circle cx="35" cy="39" r="17" fill="#52218b"/><path d="M26 47V38l7-6 6 4 7-8M41 28h5v5" fill="none" stroke="#e4ceff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="64" y="34" font-size="16" font-weight="700" fill="#fff">Resultados em destaque</text>
   <text x="64" y="55" font-size="12" fill="#c4b4d8">Visualize sua evolução</text>
  </g>
 </g>
 <path d="M0 16H1600" stroke="#c18aff" stroke-width="1" opacity=".16"/>
 <circle cx="505" cy="45" r="3" fill="#b56cff"/><circle cx="1530" cy="260" r="3" fill="#b56cff"/>
</svg>